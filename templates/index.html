
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python AI Chatbot</title>

    <!-- CSS is loaded from the public folder -->
    
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f7;
    color: #172033;
}

.app {
    display: flex;
    width: 100%;
    max-width: 1440px;
    height: 100vh;
    min-height: 500px;
    margin: auto;
    background: white;
}

.sidebar {
    width: 280px;
    flex-shrink: 0;
    padding: 30px 22px;
    background: #142b24;
    color: white;
}

.sidebar h2 {
    margin: 0 0 8px;
    font-size: 25px;
}

.sidebar p {
    color: #bdcec6;
    margin-bottom: 38px;
}

.sidebar label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
}

.sidebar select {
    width: 100%;
    padding: 13px 10px;
    border: 1px solid #496458;
    border-radius: 9px;
    background: #203b31;
    color: white;
    font-size: 14px;
}

.notice {
    margin-top: 25px;
    padding: 13px;
    border-radius: 9px;
    background: #203b31;
    color: #d3e0d9;
    font-size: 12px;
    line-height: 1.7;
}

.chat-panel {
    display: flex;
    flex: 1;
    min-width: 0;
    flex-direction: column;
}

.chat-header {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 18px 25px;
    border-bottom: 1px solid #e8edf1;
}

.avatar {
    display: grid;
    width: 44px;
    height: 44px;
    place-items: center;
    border-radius: 14px;
    background: #d9eee1;
    color: #166534;
    font-weight: bold;
}

.chat-header h3 {
    margin: 0 0 5px;
}

.chat-header span {
    color: #718096;
    font-size: 12px;
}

.messages {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    padding: 28px;
}

.message {
    max-width: 78%;
    padding: 14px 17px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.bot {
    align-self: flex-start;
    background: #f0f4f3;
    border-bottom-left-radius: 4px;
}

.user {
    align-self: flex-end;
    background: #176b4d;
    color: white;
    border-bottom-right-radius: 4px;
}

.error {
    color: #b42318;
    background: #fff0ee;
}

.chat-form {
    display: flex;
    gap: 12px;
    margin: 0 25px;
    padding: 10px;
    border: 1px solid #dce3e9;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
}

.chat-form input {
    flex: 1;
    width: 0;
    min-width: 0;
    padding: 12px;
    border: 0;
    outline: none;
    font-size: 14px;
}

.chat-form button {
    padding: 12px 20px;
    border: 0;
    border-radius: 10px;
    background: #176b4d;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.chat-form button:hover {
    background: #10553c;
}

.chat-form button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.footer-note {
    margin: 12px 25px 18px;
    color: #8993a2;
    text-align: center;
    font-size: 11px;
}

@media (max-width: 650px) {
    .app {
        height: 100dvh;
        min-height: 0;
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        padding: 15px 18px;
    }

    .sidebar h2 {
        font-size: 20px;
    }

    .sidebar p {
        margin: 5px 0 12px;
    }

    .sidebar label {
        margin-bottom: 6px;
    }

    .sidebar select {
        padding: 10px;
    }

    .notice {
        display: none;
    }

    .chat-header {
        padding: 12px 16px;
    }

    .messages {
        padding: 18px 14px;
    }

    .message {
        max-width: 92%;
    }

    .chat-form {
        margin: 0 10px;
        gap: 6px;
    }

    .chat-form button {
        padding: 11px 13px;
    }

    .footer-note {
        margin: 10px;
    }
}

        </style>
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <h2>AI Assistant</h2>
            <p>Your smart assistant</p>

            <label for="category">Choose category</label>

            <select id="category" required>
                <option value="" selected disabled>
                    -- Select a category --
                </option>

                <option value="IT">
                    💻 IT &amp; Programming
                </option>

                <option value="Medical">
                    🩺 Medical &amp; Health
                </option>

                <option value="ShareMarket">
                    📈 Share Market &amp; Investing
                </option>
            </select>
        </aside>

        <main class="chat-panel">

            <header class="chat-header">
                <div class="avatar">AI</div>

                <div>
                    <h3>AI Chatbot</h3>
                    <p>Your smart assistant</p>
                </div>
            </header>

            <section
                id="messages"
                class="messages"
                aria-live="polite"
                aria-label="Chat messages"
            >
                <div class="message bot">
                    Hello! Welcome. Select a category and ask me anything.
                </div>
            </section>

            <form id="chat-form" class="chat-form">

                <input
                    id="message-input"
                    type="text"
                    placeholder="Type your message..."
                    autocomplete="off"
                    maxlength="5000"
                    aria-label="Type your message"
                    required
                >

                <button id="send-button" type="submit">
                    Send ➤
                </button>

            </form>

            <p class="footer-note">
                AI can make mistakes. Verify important information.
            </p>

        </main>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const messages = document.getElementById("messages");
        const category = document.getElementById("category");
        const sendButton = document.getElementById("send-button");

        function addMessage(text, type) {
            const div = document.createElement("div");

            div.className = "message " + type;
            div.textContent = text;

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;

            return div;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = input.value.trim();
            const selectedCategory = category.value;

            if (!message) {
                return;
            }

            // Greetings can be sent without selecting a category.
            // Other questions require a category.
            const normalizedMessage = message
                .toLowerCase()
                .replace(/[!.,?]+$/, "")
                .trim();

            const greetings = [
                "hi", "hii", "hiii", "hello", "hey", "heyy",
                "namaste", "namaskar",
                "good morning", "good afternoon",
                "good evening", "good night",
                "how are you", "how are you doing",
                "kaise ho", "kaise hain", "kya haal hai",
                "thanks", "thank you", "thankyou",
                "bye", "goodbye"
            ];

            if (!selectedCategory &&
                !greetings.includes(normalizedMessage)) {

                addMessage(
                    "Please select a category before sending your question.",
                    "bot error"
                );

                category.focus();
                return;
            }

            addMessage(message, "user");

            input.value = "";
            sendButton.disabled = true;

            const loading = addMessage("Thinking...", "bot");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message,
                        category: selectedCategory
                    })
                });

                const data = await response.json();

                loading.textContent =
                    data.reply || "No response received.";

                if (!response.ok) {
                    loading.classList.add("error");
                }

            } catch (error) {
                loading.textContent =
                    "Connection error. Check that the Python server is running.";

                loading.classList.add("error");

            } finally {
                sendButton.disabled = false;
                input.focus();
                messages.scrollTop = messages.scrollHeight;
            }
        });
    </script>
</body>
</html>
